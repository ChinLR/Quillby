# Render Blueprint: the backend as a long-running web service.
# Dashboard: New > Blueprint > pick this repo. You will be asked for LLM_API_KEY (it is never stored in git).
services:
  - type: web
    name: quillby-backend
    runtime: python
    plan: free            # sleeps after about 15 min idle; use "starter" to keep it awake
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PUBLIC_MODE        # rate limits for a public link
        value: "1"
      - key: CALL_FEATURE       # no phone call: the deal is settled in the chat
        value: "0"
      - key: LLM_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/
      - key: LLM_MODEL
        value: deepseek-ai/DeepSeek-V4.1-Flash
      - key: LLM_API_KEY        # your Nebius key, entered in the Render dashboard
        sync: false
